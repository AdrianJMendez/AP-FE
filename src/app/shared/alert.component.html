@if (config) {

  <div class="fixed inset-0 z-[200] flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm animate-fade-in"></div>


    <div class="relative bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden animate-modal-in">

      <div class="h-1.5 w-full"
           [class.bg-green-500]="config.type === 'success'"
           [class.bg-red-500]="config.type === 'error'"
           [class.bg-yellow-500]="config.type === 'warning'"
           [class.bg-blue-500]="config.type === 'info' || config.type === 'confirm'">
      </div>

      @if (config.type !== 'confirm') {
        <button (click)="alertService.close()"
                class="absolute top-4 right-4 p-1.5 rounded-full bg-gray-100 hover:bg-gray-200 transition-colors">
          <lucide-icon [name]="X" class="w-4 h-4 text-gray-500"></lucide-icon>
        </button>
      }

      <div class="p-7">


        <div class="flex justify-center mb-4">
          <div class="w-16 h-16 rounded-full flex items-center justify-center"
               [ngClass]="colorFor(config.type).bg">
            <lucide-icon [name]="iconFor(config.type)"
                         class="w-8 h-8"
                         [ngClass]="colorFor(config.type).icon"></lucide-icon>
          </div>
        </div>

        <div class="text-center mb-6">
          <h3 class="text-lg font-black text-gray-900 mb-1">{{ config.title }}</h3>
          <p class="text-sm text-gray-500 leading-relaxed">{{ config.message }}</p>
        </div>


        @if (config.type === 'confirm') {
          <div class="flex gap-3">
            <button (click)="handleCancel()"
                    class="flex-1 py-3 rounded-2xl border border-gray-200 text-sm font-bold
                           text-gray-600 hover:bg-gray-50 transition-colors">
              {{ config.cancelLabel || 'Cancelar' }}
            </button>
            <button (click)="handleConfirm()"
                    class="flex-1 py-3 rounded-2xl text-white text-sm font-bold transition-colors"
                    [ngClass]="colorFor(config.type).btn">
              {{ config.confirmLabel || 'Confirmar' }}
            </button>
          </div>
        } @else {
          <button (click)="alertService.close()"
                  class="w-full py-3 rounded-2xl text-white text-sm font-bold transition-colors"
                  [ngClass]="colorFor(config.type).btn">
            Aceptar
          </button>
        }

      </div>
    </div>
  </div>
}
